listen 8080;
listen [::]:8080;
listen 8443 ssl;
listen [::]:8443 ssl;

# Plain HTTP on the TLS listener is rejected before rewrite rules run.
error_page 497 =308 https://$host:8443$request_uri;

# $host excludes the incoming HTTP port; HTTPS is exposed on 8443, not 443.
if ($scheme = http) {
    return 308 https://$host:8443$request_uri;
}
