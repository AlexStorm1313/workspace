# Translate only the local edge's browser origins, never arbitrary Origins.
map $http_origin $hermes_origin {
    default $http_origin;
    "http://hermes.workspace.localhost:8080" http://127.0.0.1:9119;
    "https://hermes.workspace.localhost:8443" http://127.0.0.1:9119;
}

server {
    listen 9120;

    # WS query strings and page referrers contain session capabilities.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9119;
        proxy_set_header Origin $hermes_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
