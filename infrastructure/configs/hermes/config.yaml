onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
moa:
  presets:
    default:
      reference_models:
        - provider: openai-codex
          model: gpt-5.5
          enabled: true
      aggregator:
        provider: openai-codex
        model: gpt-6.1-sol
      degraded_reference_policy: loud
      fanout: user_turn
      enabled: false
  reference_models:
    - provider: openai-codex
      model: gpt-5.5
      enabled: true
  aggregator:
    provider: openai-codex
    model: gpt-6.1-sol
  degraded_reference_policy: loud
  fanout: user_turn
  enabled: true
platforms:
  telegram:
    enabled: true
dashboard:
  font: theme
  theme: default
command_allowlist:
  - execute_code
providers:
  ollama:
    name: Ollama
    base_url: http://workspace-ollama-pod:11434/v1
    transport: chat_completions
    models:
      "qwen3.5:9b":
        context_length: 262144
      "hermes3:8b":
        context_length: 131072
      "ministral-3:14b":
        context_length: 131072
      "ministral-3:8b":
        context_length: 262144
model:
  default: gpt-6.1-sol
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  api_mode: codex_responses
_config_version: 51
skills:
  create_dir: ~/.hermes/improvement_skills
  external_dirs:
    - ~/.hermes/custom_skills
model_catalog:
  excluded_providers:
    - actual
    - ai-gateway
    - alibaba
    - alibaba-cn
    - alibaba-coding-plan
    - alibaba-coding-plan-cn
    - alibaba-token-plan
    - alibaba-token-plan-cn
    - anthropic
    - arcee
    - azure-foundry
    - bedrock
    - commandcode
    - commandcode-anthropic
    - copilot
    - copilot-acp
    - deepinfra
    - deepseek
    - fireworks
    - gemini
    - gmi
    - huggingface
    - kilocode
    - kimi-coding
    - kimi-coding-cn
    - lmstudio
    - meta-ai
    - minimax
    - minimax-cn
    - minimax-oauth
    - moa
    - nebius-token-factory
    - nous
    - novita
    - nvidia
    - ollama-cloud
    - openai-api
    - opencode-go
    - opencode-zen
    - openrouter
    - qwen-oauth
    - router
    - stepfun
    - tencent-tokenhub
    - tencent-tokenplan
    - upstage
    - vertex
    - xai
    - xai-oauth
    - xiaomi
    - zai
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
