{{ if .Values.services.hermes.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hermes
  labels:
    app: {{ .Release.Name }}-hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-hermes
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-hermes
    spec:
      {{ include "pod.securityContext" . | indent 6 }}
      # Both containers share Hermes home below, but local discovery also validates PIDs.
      shareProcessNamespace: true

      containers:
        - name: gateway
          {{ include "container.securityContext" . | indent 10 }}
          image: {{ .Values.services.hermes.image }}
          imagePullPolicy: {{ .Values.deployments.containers.pullPolicy }}
          # The shared PID namespace makes the pod infra process PID 1.
          command: ["tini", "-s", "--"]
          args: ["hermes", "gateway", "run"]
          env:
            - name: HERMES_HOME
              value: /home/core/.hermes
          volumeMounts:
            - name: {{ .Release.Name }}-hermes-hermes
              mountPath: /home/core/.hermes

        - name: proxy
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          image: docker.io/nginx:latest
          imagePullPolicy: {{ .Values.deployments.containers.pullPolicy }}
          volumeMounts:
            - name: {{ .Release.Name }}-hermes-configmaps
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
        - name: dashboard
          {{ include "container.securityContext" . | indent 10 }}
          image: {{ .Values.services.hermes.image }}
          imagePullPolicy: {{ .Values.deployments.containers.pullPolicy }}
          command: ["tini", "-s", "--"]
          # Passwordless mode requires a real loopback bind. Do not set public_url.
          args: ["hermes", "dashboard", "--skip-build", "--host", "127.0.0.1", "--port", "9119", "--no-open"]
          env:
            - name: HERMES_HOME
              value: /home/core/.hermes
          volumeMounts:
            - name: {{ .Release.Name }}-hermes-hermes
              mountPath: /home/core/.hermes
          # env:
          #   - name: CONTAINER_HOST
          #     value: unix:///run/podman.sock
          #   - name: SSH_AUTH_SOCK
          #     value: /run/sshd.sock
          # volumeMounts:
            # - name: {{ .Release.Name }}-hermes-hermes
            #   mountPath: /home/core/.local
            #   subPath: .local
            # - name: {{ .Release.Name }}-hermes-hermes
            #   mountPath: /home/core/.cache
            #   subPath: .cache
            # - name: {{ .Release.Name }}-hermes-hermes
            #   mountPath: /home/core/.config
            #   subPath: .config

            # - name: {{ .Release.Name }}-workspace-configmaps
            #   mountPath: /home/core/.gitconfig
            #   subPath: .gitconfig
            #   readOnly: true
            # - name: {{ .Release.Name }}-hermes-configmaps
            #   mountPath: /home/core/.config/hermes/hermes.json
            #   subPath: hermes.json

            # {{ range .Values.deployments.volumes }}
            # - name: {{ . }}
            #   mountPath: /home/core/workspace/{{ . }}
            # {{ end }}
            # {{ range .Values.deployments.volumeMounts }}
            # - name: {{ .name }}
            #   mountPath: /home/core/workspace/{{ .name }}
            # {{ end }}

            # - name: sshd.sock
            #   mountPath: /run/sshd.sock
            #   readOnly: true
            # - name: podman.sock
            #   mountPath: /run/podman.sock
        

      volumes:  
        # Mount the same PVC root; pod fsGroup grants GID 0 volume access.
        # Image dependencies must live outside this mount, not just the /opt/hermes checkout.
        - name: {{ .Release.Name }}-hermes-hermes
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-hermes-hermes

        - name: {{ .Release.Name }}-workspace-configmaps
          configMap:
            name: {{ .Release.Name }}-workspace
            optional: true

        - name: {{ .Release.Name }}-hermes-secrets
          secret:
            secretName: {{ .Release.Name }}-hermes
            optional: true
        - name: {{ .Release.Name }}-hermes-configmaps
          configMap:
            name: {{ .Release.Name }}-hermes

        {{ range .Values.deployments.volumes }}
        - name: {{ . }}
          persistentVolumeClaim:
            claimName: {{ . }}
        {{ end }}
        {{ range .Values.deployments.volumeMounts }}
        - name: {{ .name }}
          hostPath:
            path: {{ .mountPath }}
            type: Directory
        {{ end }}

        - name: podman.sock
          hostPath:
            path: /run/user/1000/podman/podman.sock
            type: Socket
        - name: sshd.sock
          hostPath:
            path: /run/user/1000/gcr/ssh
            type: Socket
{{ end }}
