{{ if .Values.services.hermes.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hermes
  labels:
    app: {{ .Release.Name }}-hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-hermes
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-hermes
    spec:
      {{ include "pod.securityContext" . | indent 6 }}
      shareProcessNamespace: true
      containers:
        - name: gateway
          {{ include "container.securityContext" . | indent 10 }}
          image: {{ .Values.services.hermes.image }}
          imagePullPolicy: {{ .Values.deployments.containers.pullPolicy }}
          # The shared PID namespace makes the pod infra process PID 1.
          command: ["tini", "-s", "--"]
          args: ["hermes", "gateway", "run"]
          env:
            - name: HERMES_HOME
              value: /home/core/.hermes
            - name: HERMES_HOME_MODE
              value: 0700
            
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-hermes
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_HOME_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-hermes
                  key: TELEGRAM_HOME_CHAT_ID
            - name: TELEGRAM_HOME_CHANNEL_NAME
              value: Alex
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-hermes
                  key: TELEGRAM_HOME_USER_ID
          volumeMounts:
            - name: {{ .Release.Name }}-hermes-hermes
              mountPath: /home/core/.hermes
            - name: config.yaml
              mountPath: /home/core/.hermes/config.yaml
            - name: auth.json
              mountPath: /home/core/.hermes/auth.json
            - name: .hermes
              mountPath: /home/core/.hermes/custom_skills
              subPath: custom_skills
              readOnly: true
            - name: .hermes
              mountPath: /home/core/.hermes/improvement_skills
              subPath: improvement_skills

        - name: proxy
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          image: docker.io/nginx:latest
          imagePullPolicy: {{ .Values.deployments.containers.pullPolicy }}
          volumeMounts:
            - name: {{ .Release.Name }}-hermes-configmaps
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
        - name: dashboard
          {{ include "container.securityContext" . | indent 10 }}
          image: {{ .Values.services.hermes.image }}
          imagePullPolicy: {{ .Values.deployments.containers.pullPolicy }}
          command: ["tini", "-s", "--"]
          args: ["hermes", "dashboard", "--skip-build", "--host", "127.0.0.1", "--port", "9119", "--no-open"]
          env:
            - name: HERMES_HOME
              value: /home/core/.hermes
            - name: HERMES_HOME_MODE
              value: 0700
          volumeMounts:
            - name: {{ .Release.Name }}-hermes-hermes
              mountPath: /home/core/.hermes
            - name: config.yaml
              mountPath: /home/core/.hermes/config.yaml
            - name: auth.json
              mountPath: /home/core/.hermes/auth.json
            - name: .hermes
              mountPath: /home/core/.hermes/custom_skills
              subPath: custom_skills
              readOnly: true
            - name: .hermes
              mountPath: /home/core/.hermes/improvement_skills
              subPath: improvement_skills

          # env:
          #   - name: CONTAINER_HOST
          #     value: unix:///run/podman.sock
          #   - name: SSH_AUTH_SOCK
          #     value: /run/sshd.sock
          # volumeMounts:
            # - name: {{ .Release.Name }}-hermes-hermes
            #   mountPath: /home/core/.local
            #   subPath: .local
            # - name: {{ .Release.Name }}-hermes-hermes
            #   mountPath: /home/core/.cache
            #   subPath: .cache
            # - name: {{ .Release.Name }}-hermes-hermes
            #   mountPath: /home/core/.config
            #   subPath: .config

            # - name: {{ .Release.Name }}-workspace-configmaps
            #   mountPath: /home/core/.gitconfig
            #   subPath: .gitconfig
            #   readOnly: true
            # - name: {{ .Release.Name }}-hermes-configmaps
            #   mountPath: /home/core/.config/hermes/hermes.json
            #   subPath: hermes.json

            # {{ range .Values.deployments.volumes }}
            # - name: {{ . }}
            #   mountPath: /home/core/{{ . }}
            # {{ end }}
            # {{ range .Values.deployments.volumeMounts }}
            # - name: {{ .name }}
            #   mountPath: /home/core/{{ .name }}
            # {{ end }}

            # - name: sshd.sock
            #   mountPath: /run/sshd.sock
            #   readOnly: true
            # - name: podman.sock
            #   mountPath: /run/podman.sock
        

      volumes:  
        - name: {{ .Release.Name }}-hermes-hermes
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-hermes-hermes

        - name: {{ .Release.Name }}-workspace-configmaps
          configMap:
            name: {{ .Release.Name }}-workspace
            optional: true

        - name: {{ .Release.Name }}-hermes-secrets
          secret:
            secretName: {{ .Release.Name }}-hermes
            optional: true
        - name: {{ .Release.Name }}-hermes-configmaps
          configMap:
            name: {{ .Release.Name }}-hermes

        {{ range .Values.deployments.volumes }}
        - name: {{ . }}
          persistentVolumeClaim:
            claimName: {{ . }}
        {{ end }}
        {{ range .Values.deployments.volumeMounts }}
        - name: {{ .name }}
          hostPath:
            path: {{ .mountPath }}
            type: Directory
        {{ end }}

        - name: config.yaml
          hostPath:
            path: /home/core/Development/workspace/infrastructure/configs/hermes/config.yaml
            type: File

        - name: auth.json
          hostPath:
            path: /home/core/Development/workspace/infrastructure/secrets/hermes/auth.json
            type: File

        - name: .hermes
          hostPath:
            path: /home/core/Development/workspace/infrastructure/state/hermes/.hermes
            type: Directory

        - name: podman.sock
          hostPath:
            path: /run/user/1000/podman/podman.sock
            type: Socket
        - name: sshd.sock
          hostPath:
            path: /run/user/1000/gcr/ssh
            type: Socket
{{ end }}
