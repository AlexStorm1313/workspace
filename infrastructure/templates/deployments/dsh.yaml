{{ if .Values.services.dsh.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dsh
  labels:
    app: {{ .Release.Name }}-dsh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-dsh
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-dsh
    spec:
      {{ include "pod.securityContext" . | indent 6 }}
      # initContainers:
      #   - name: mkdir
      #     {{ include "container.securityContext" . | indent 10 }}
      #     image: docker.io/busybox:latest
      #     command: ["/bin/mkdir"]
      #     args: ["-p",
      #       "/mnt/{{ .Release.Name }}-dsh-dsh/.local",
      #       "/mnt/{{ .Release.Name }}-dsh-dsh/.cache",
      #       "/mnt/{{ .Release.Name }}-dsh-dsh/.config",
      #     ]
      #     volumeMounts:
      #       - name: {{ .Release.Name }}-dsh-dsh
      #         mountPath: /mnt/{{ .Release.Name }}-dsh-dsh
      containers:
        - name: server
          {{ include "container.securityContext" . | indent 10 }}
          image: {{ .Values.services.dsh.image }}
          imagePullPolicy: {{ .Values.deployments.containers.pullPolicy }}
          command: ["tini", "--", "/bin/sh", "-c"]
          args: ["exec dsh web --host $(hostname -i | awk '{print $1}') --port 3000 --no-open --trusted-host dsh.workspace.localhost --public-url https://dsh.workspace.localhost:8443/"]
          env:
            - name: CONTAINER_HOST
              value: unix:///run/podman.sock
            - name: SSH_AUTH_SOCK
              value: /run/sshd.sock
          # volumeMounts:
          #   - name: {{ .Release.Name }}-dsh-dsh
          #     mountPath: /home/core/.local
          #     subPath: .local
          #   - name: {{ .Release.Name }}-dsh-dsh
          #     mountPath: /home/core/.cache
          #     subPath: .cache
          #   - name: {{ .Release.Name }}-dsh-dsh
          #     mountPath: /home/core/.config
          #     subPath: .config

          #   - name: {{ .Release.Name }}-workspace-configmaps
          #     mountPath: /home/core/.gitconfig
          #     subPath: .gitconfig
          #     readOnly: true
          #   - name: {{ .Release.Name }}-dsh-configmaps
          #     mountPath: /home/core/.config/dsh/dsh.json
          #     subPath: dsh.json

          #   {{ range .Values.deployments.volumes }}
          #   - name: {{ . }}
          #     mountPath: /home/core/workspace/{{ . }}
          #   {{ end }}
          #   {{ range .Values.deployments.volumeMounts }}
          #   - name: {{ .name }}
          #     mountPath: /home/core/workspace/{{ .name }}
          #   {{ end }}

            - name: sshd.sock
              mountPath: /run/sshd.sock
              readOnly: true
            - name: podman.sock
              mountPath: /run/podman.sock

      volumes:  
        - name: {{ .Release.Name }}-dsh-dsh
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-dsh-dsh

        - name: {{ .Release.Name }}-workspace-configmaps
          configMap:
            name: {{ .Release.Name }}-workspace
            optional: true

        - name: {{ .Release.Name }}-dsh-secrets
          secret:
            secretName: {{ .Release.Name }}-dsh
            optional: true
        - name: {{ .Release.Name }}-dsh-configmaps
          configMap:
            name: {{ .Release.Name }}-dsh
            optional: true

        {{ range .Values.deployments.volumes }}
        - name: {{ . }}
          persistentVolumeClaim:
            claimName: {{ . }}
        {{ end }}
        {{ range .Values.deployments.volumeMounts }}
        - name: {{ .name }}
          hostPath:
            path: {{ .mountPath }}
            type: Directory
        {{ end }}

        - name: podman.sock
          hostPath:
            path: /run/user/1000/podman/podman.sock
            type: Socket
        - name: sshd.sock
          hostPath:
            path: /run/user/1000/gcr/ssh
            type: Socket
{{ end }}
