deployments:
  containers:
    pullPolicy: IfNotPresent
    # pullPolicy: Always
  volumes:
  volumeMounts:
    - name: development
      mountPath: /home/core/Development

services:
  codium:
    enabled: false
    image: ghcr.io/alexstorm1313/core:latest
  chromium:
    enabled: true
    image: lscr.io/linuxserver/chromium:latest
  dbgate:
    enabled: false
    image: docker.io/dbgate/dbgate:latest
  gateway:
    enabled: true
    image: docker.io/nginx:latest
  ollama:
    enabled: false
    image: docker.io/ollama/ollama:rocm
  open-webui:
    enabled: false
    image: ghcr.io/open-webui/open-webui:main
  openclaw:
    enabled: false
    image: ghcr.io/alexstorm1313/core:latest
    proxyImage: docker.io/nginx:latest
  opencode:
    enabled: false
    image: ghcr.io/alexstorm1313/core:latest
  openhands:
    enabled: false
    image: ghcr.io/alexstorm1313/core:latest
  redis-insight:
    enabled: true
    image: docker.io/redis/redisinsight:latest
  scalar:
    enabled: true
    image: docker.io/scalarapi/api-reference:latest
  workspace:
    enabled: true
    image: localhost/core:latest
