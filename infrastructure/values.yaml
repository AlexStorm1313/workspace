deployments:
  containers:
    pullPolicy: IfNotPresent
    # pullPolicy: Always
  volumes:
  volumeMounts:
    - name: Development
      mountPath: /home/core/Development

services:
  chromium:
    enabled: false
    image: lscr.io/linuxserver/chromium:latest
  codium:
    enabled: false
    image: localhost/core:latest
  dbgate:
    enabled: false
    image: docker.io/dbgate/dbgate:latest
  gateway:
    enabled: true
    image: docker.io/nginx:latest
  hermes:
    enabled: true
    image: localhost/core:latest
  ollama:
    enabled: true
    image: docker.io/ollama/ollama:rocm
  opencode:
    enabled: true
    image: localhost/core:latest
  redis-insight:
    enabled: false
    image: docker.io/redis/redisinsight:latest
  scalar:
    enabled: false
    image: docker.io/scalarapi/api-reference:latest
  workspace:
    enabled: true
    image: localhost/core:latest
